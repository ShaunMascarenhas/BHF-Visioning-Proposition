<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100">
  <!-- Sunburst / house icon — white knockout version for dark backgrounds -->
  <g transform="translate(20, 10)">
    <!-- Radiating lines -->
    <line x1="35" y1="40" x2="35" y2="5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="40" x2="12" y2="15" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="40" x2="58" y2="15" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="40" x2="0" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="40" x2="70" y2="30" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- House shape -->
    <path d="M10 45 L35 25 L60 45 L60 75 L10 75 Z" fill="#ffffff" opacity="0.9"/>
    <!-- Door -->
    <rect x="27" y="55" width="16" height="20" rx="2" fill="#050a1a"/>
  </g>
  <!-- Text -->
  <text x="100" y="48" font-family="'Roboto', sans-serif" font-size="28" font-weight="900" fill="#ffffff" letter-spacing="1">Brighthouse</text>
  <text x="100" y="78" font-family="'Roboto', sans-serif" font-size="18" font-weight="400" fill="#ffffff" letter-spacing="6">FINANCIAL</text>
</svg>
